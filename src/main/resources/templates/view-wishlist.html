
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wishlist</title>
    <link th:href="@{/style.css}" rel="styleSheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div id="viewWishesBox">
    <h1 class="textBox">Wishes</h1>
<table>
    <tr th:if="${wishlist.wishes.isEmpty()}">There are no wishes in this wishlist</tr>
    <tr th:if="${!wishlist.wishes.isEmpty()}">
        <th>Name</th>
        <th>Description</th>
        <th>Link</th>
    </tr>
    <tr th:each="wish: ${wishlist.wishes}">
        <td th:text="${wish.name}"></td>
        <td th:text="${wish.description}"></td>
        <td><a class="wishlistButton" th:href="${wish.url}">link</a></td>
        <td>
            <a class="wishlistButton" th:href="@{/wishes/{title}/{name}/view(title=${wishlist.title}, name=${wish.name})}">Open</a>
        </td>
        <td>
            <a class="wishlistButton" th:href="@{/wishes/{title}/{name}/edit(title=${wishlist.title}, name=${wish.name})}">Edit wish</a>
        </td>
        <td>
            <form action="#" th:action="@{/wishes/{title}/{name}/delete(title=${wishlist.title}, name=${wish.name})}" method="post">
                <button class="wishlistButton" type="submit">Delete wish</button>
            </form>
        </td>
    </tr>
</table>

<a class="wishlistButton" id="addNewWish" th:href="@{/wishes/add}">Add new wish</a>
    <a class="wishlistButton" th:href="@{/wishes/{title}/view(title=${wishlist.title})}">Back to wishlists</a>
</div>
</body>
</html>
