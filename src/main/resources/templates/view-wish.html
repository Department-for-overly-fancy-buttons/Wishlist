
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wish</title>
    <link th:href="@{/style.css}" rel="styleSheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div id="viewWishBox">
    <h1 class="textBox">Wish</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Link</th>
    </tr>
    <tr>
        <td th:text="${wish.name}"></td>
        <td th:text="${wish.description}"></td>
        <td><a class="wishlistButton" th:href="${wish.url}">link</a></td>
    </tr>
</table>

<a class="wishlistButton" th:href="@{/wishes}">back</a>
</div>
</body>
</html>
